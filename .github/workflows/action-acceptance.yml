name: Action runtime acceptance
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  action-runtime:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        os: [ubuntu-latest, macos-latest]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24
      - name: Check secure filesystem runtime
        run: python3 -c "import sys; assert sys.version_info >= (3, 10), 'Python 3.10 or newer required'"
      - name: Create disposable synthetic repositories
        id: fixtures
        shell: bash
        run: |
          node --input-type=module <<'JS'
          import { mkdtempSync, mkdirSync, writeFileSync, appendFileSync } from 'node:fs';
          import { join } from 'node:path';
          import { execFileSync } from 'node:child_process';
          const fixtures = mkdtempSync(join(process.env.RUNNER_TEMP, 'zof-action-acceptance-'));
          const gitEnv = { ...process.env, GIT_CONFIG_GLOBAL: '/dev/null', GIT_CONFIG_NOSYSTEM: '1' };
          for (const variant of ['unsafe', 'clean']) {
            const root = join(fixtures, variant);
            mkdirSync(root);
            const git = (...args) => execFileSync('git', ['-C', root, ...args], { stdio: 'ignore', env: gitEnv });
            git('init', '-b', 'main');
            git('config', 'user.name', 'Synthetic Acceptance');
            git('config', 'user.email', 'synthetic@example.invalid');
            writeFileSync(join(root, 'safe.ts'), 'export const value = 1;\n');
            git('add', 'safe.ts');
            git('commit', '-m', 'Synthetic baseline');
            writeFileSync(join(root, 'safe.ts'), variant === 'unsafe' ? 'export const value = eval("2");\n' : 'export const value = 2;\n');
            appendFileSync(process.env.GITHUB_OUTPUT, `${variant}-root=${root}\n`);
          }
          appendFileSync(process.env.GITHUB_OUTPUT, `fixture-root=${fixtures}\n`);
          JS
      - name: Run the action against an unsafe change
        id: unsafe
        uses: ./
        continue-on-error: true
        env:
          ZOF_ACCEPTANCE_MARKER: synthetic-ci-environment-must-not-appear
        with:
          path: ${{ steps.fixtures.outputs.unsafe-root }}
          fail_on: high
      - name: Verify failing static evidence
        env:
          EVIDENCE_DIRECTORY: ${{ steps.unsafe.outputs.evidence-directory }}
          ACTION_RESULT: ${{ steps.unsafe.outputs.result }}
          ACTION_OUTCOME: ${{ steps.unsafe.outcome }}
        shell: bash
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { readFileSync, realpathSync } from 'node:fs';
          import { join, resolve, relative, isAbsolute } from 'node:path';
          assert.equal(process.env.ACTION_OUTCOME, 'failure');
          assert.equal(process.env.ACTION_RESULT, 'fail');
          assert.ok(process.env.EVIDENCE_DIRECTORY);
          const directory = realpathSync(process.env.EVIDENCE_DIRECTORY);
          const within = relative(realpathSync(process.env.RUNNER_TEMP), directory);
          assert.ok(within && !within.startsWith('..') && !isAbsolute(within));
          const files = Object.fromEntries(['evidence.json', 'report.json', 'report.md', 'report.sarif'].map(name => [name, readFileSync(join(directory, name), 'utf8')]));
          const evidence = JSON.parse(files['evidence.json']);
          assert.equal(evidence.schemaVersion, '1.0.0');
          assert.equal(evidence.type, 'static-analysis');
          assert.deepEqual(evidence.execution, { status: 'completed', result: 'fail' });
          assert.ok(evidence.findings.some(finding => finding.id === 'dynamic-evaluation'));
          assert.deepEqual(evidence.tests, []);
          assert.equal(evidence.source.commit, null);
          assert.equal(JSON.parse(files['report.sarif']).version, '2.1.0');
          assert.doesNotMatch(JSON.stringify(files), /synthetic-ci-environment-must-not-appear/);
          console.log('PASS: real Action runtime rejects unsafe change and emits static evidence without claiming tests ran.');
          JS
      - name: Run the action against a safe change
        id: clean
        uses: ./
        env:
          ZOF_ACCEPTANCE_MARKER: synthetic-ci-environment-must-not-appear
        with:
          path: ${{ steps.fixtures.outputs.clean-root }}
          fail_on: high
      - name: Verify passing static evidence
        env:
          EVIDENCE_DIRECTORY: ${{ steps.clean.outputs.evidence-directory }}
          ACTION_RESULT: ${{ steps.clean.outputs.result }}
          ACTION_OUTCOME: ${{ steps.clean.outcome }}
        shell: bash
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { readFileSync, realpathSync } from 'node:fs';
          import { join, resolve, relative, isAbsolute } from 'node:path';
          assert.equal(process.env.ACTION_OUTCOME, 'success');
          assert.equal(process.env.ACTION_RESULT, 'pass');
          assert.ok(process.env.EVIDENCE_DIRECTORY);
          const directory = realpathSync(process.env.EVIDENCE_DIRECTORY);
          const within = relative(realpathSync(process.env.RUNNER_TEMP), directory);
          assert.ok(within && !within.startsWith('..') && !isAbsolute(within));
          const files = Object.fromEntries(['evidence.json', 'report.json', 'report.md', 'report.sarif'].map(name => [name, readFileSync(join(directory, name), 'utf8')]));
          const evidence = JSON.parse(files['evidence.json']);
          assert.equal(evidence.type, 'static-analysis');
          assert.deepEqual(evidence.execution, { status: 'completed', result: 'pass' });
          assert.deepEqual(evidence.findings, []);
          assert.deepEqual(evidence.tests, []);
          assert.equal(evidence.source.commit, null);
          assert.doesNotMatch(JSON.stringify(files), /synthetic-ci-environment-must-not-appear/);
          console.log('PASS: real Action runtime accepts safe change and emits static evidence without claiming tests ran.');
          JS
      - name: Remove synthetic repositories
        if: always()
        env:
          FIXTURE_ROOT: ${{ steps.fixtures.outputs.fixture-root }}
        shell: bash
        run: |
          node --input-type=module <<'JS'
          import { rmSync, realpathSync } from 'node:fs';
          import { resolve, relative, isAbsolute, basename } from 'node:path';
          if (process.env.FIXTURE_ROOT) {
            const directory = realpathSync(process.env.FIXTURE_ROOT);
            const within = relative(realpathSync(process.env.RUNNER_TEMP), directory);
            if (!within || within.startsWith('..') || isAbsolute(within) || !basename(directory).startsWith('zof-action-acceptance-')) throw new Error('Unexpected fixture directory');
            rmSync(directory, { recursive: true, force: true });
          }
          JS
